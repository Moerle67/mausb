{% load static %}

<!doctype html>
<html lang="de">

<head>
    <title>{% block title %}Ausbildungsplan Entwurf{% endblock title %}</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <!-- Bootstrap CSS v5.2.1 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"> 
    <script>let benutzer = '{{request.user}}'</script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.3/moment.min.js">
    </script>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <header class="d-print-none mb-2">
        <!-- place navbar here -->
        {% include "stammdaten/navbar.html" %}
    </header>
    <main>
        <div class="container" style="margin-top: 5em;">
            {% block content %}
            {% endblock content %}
        </div>
        <div class="container-fluid" style="margin-top: 5em;">
            {% block content_fluid %}
            {% endblock content_fluid %}
        </div>
    </main>
    <footer>
        <!-- place footer here -->
    </footer>
    <!-- Bootstrap JavaScript Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
        integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
        crossorigin="anonymous"></script>
    {% block js %}
    {% endblock js %}
    <script>
        // Funktion Task abfragen 
        function get_task() {
            $.ajax({
                type: "POST",
                url: "{% url 'stammdaten:task' %}",
                data: {
                    test: 'test',
                    csrfmiddlewaretoken: '{{ csrf_token }}',
                },
                success: function(data) {
                    if (data['error'] == false) {
                        var task = data['task'];
                        if (task > 0) {
                            $('#task').text(task); 
                        } else {
                            $('#task').text();
                        }
                    } else {
                        $('#task').text();
                    }
                }
            });
        }
            {% comment %} Beim Start Task abfragen {% endcomment %}
        $( document ).ready(get_task());
            {% comment %} Task Abfrage aller 30 Sekunden {% endcomment %}
        $( document ).ready(function() {
            var timerId = setInterval(get_task, 30000);  // aller 30 Sekunden
        });

        function ajax_login(){
            var name = $('#name').val();
            var password = $('#password').val();
            $.ajax({
                type: "POST",
                url: "{% url 'stammdaten:ajax_login' %}",
                data: {
                    name: name,
                    password: password,
                    csrfmiddlewaretoken: '{{ csrf_token }}',
                },
                success: function(data) {
                    if (data['error'] == false) {
                        // erfolgreich angemeldet
                        window.location.reload(true);
                    } else {
                        alert("Anmeldung gescheitert");
                    }
                }
            });
        }
    </script>    
</body>

</html>
