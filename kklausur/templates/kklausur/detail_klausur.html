{% extends "kklausur/aklausur.html" %}

{% block detail_klausur %}
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/selectize.js/0.15.2/css/selectize.bootstrap5.min.css" integrity="sha512-Ars0BmSwpsUJnWMw+KoUKGKunT7+T8NGK0ORRKj+HT8naZzLSIQoOSIIM3oyaJljgLxFi0xImI5oZkAWEFARSA==" crossorigin="anonymous" referrerpolicy="no-referrer">
<script src="https://cdnjs.cloudflare.com/ajax/libs/selectize.js/0.15.2/js/selectize.min.js" integrity="sha512-IOebNkvA/HZjMM7MxL0NYeLYEalloZ8ckak+NDtOViP7oiYzG5vn6WVXyrJDiJPhl4yRdmNAG49iuLmhkUdVsQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>    

<h2>Details Klausur</h2>
    <form>
        <div class="mb-3">
            <label for="frmTitel" class="form-label">Titel</label>
            <input 
                type        = "text" 
                class       = "form-control" 
                id          = "frmTitel"
                value       = "{{klausur_detail.title}}"
                onchange    = "onchange_txt_title(this, {{klausur_detail.id}})"
            >       
        </div>
        <div class="mb-3">
        <label for="frmSelect" class="form-label">Thema</label>
            <select 
                class       = "form-select" 
                id          = "frmSelect"
                onchange    = "onchange_sct_thema(this, {{klausur_detail.id}})"
            >
                <option value="-" selected>Auswahl</option>
                {% for thema in themen %}
                    <option 
                        value="{{thema.id}}"
                        {% if thema_aktiv == thema.id %}selected {% endif %}
                    >{{thema}}</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="meeting-time">Choose a time for your appointment:</label>

            <input
            type="datetime-local"
            id="meeting-time"
            name="meeting-time"
            value="{{str_date}}"
                />

                    </div>    
    </form>
</div>
<script>
    $(document).ready(function() {
        $('#frmSelect').selectize({
            sortField: 'text'
        });
    });
    function onchange_txt_title(element, klausur) {
        $.ajax({
            type: "POST",
            url: "{% url 'klausur:chg_klausur_title' %}",

            data: {
                klausur : klausur,
                title   : element.value,

                csrfmiddlewaretoken: '{{ csrf_token }}'
            },
            success: function(data) {

            }
        });
    }
    function onchange_sct_thema(element, klausur) {
        $.ajax({
            type: "POST",
            url: "{% url 'klausur:chg_klausur_thema' %}",

            data: {
                klausur : klausur,
                thema   : element.value,

                csrfmiddlewaretoken: '{{ csrf_token }}'
            },
            success: function(data) {

            }
        });
    }
</script>
{% endblock detail_klausur %}
